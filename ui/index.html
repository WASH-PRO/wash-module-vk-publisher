<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VK Publisher</title>
  <link rel="stylesheet" href="wash-module-ui.css" />
</head>
<body class="wm-body">
  <div id="wm-app"></div>
  <script src="wash-module-sdk.js"></script>
  <script>
    WashModule.createPage({
      moduleId: 'vk-publisher',
      accent: '#0077ff',
      refreshInterval: 12000,
      title: { ru: 'VK публикатор', en: 'VK publisher' },
      subtitle: {
        ru: 'Публикует записи CRM «Публикации» в сообщество VK по времени publishedAt. Фото загружается во вложение поста.',
        en: 'Publishes CRM Publications to a VK community at publishedAt. Photos are uploaded as attachments.',
      },
      settingsHtml: `
        <div class="wm-field wm-field--full">
          <label class="wm-field-label" for="vk_access_token">${WashModule.t({ ru: 'Токен VK API', en: 'VK API token' })}</label>
          <input class="wm-input" id="vk_access_token" type="password" name="vk_access_token" autocomplete="off" placeholder="vk1.a...." />
          <span class="wm-field-hint">${WashModule.t({ ru: 'Права: wall, groups, photos. Оставьте пустым, чтобы не менять сохранённый токен.', en: 'Scopes: wall, groups, photos. Leave empty to keep the saved token.' })}</span>
        </div>
        <div class="wm-field">
          <label class="wm-field-label" for="vk_group_id">${WashModule.t({ ru: 'ID сообщества', en: 'Community ID' })}</label>
          <input class="wm-input" id="vk_group_id" type="text" name="vk_group_id" placeholder="123456789" />
          <span class="wm-field-hint">${WashModule.t({ ru: 'Числовой ID без минуса.', en: 'Numeric ID without minus sign.' })}</span>
        </div>
        <div class="wm-field">
          <label class="wm-field-label" for="poll_interval">${WashModule.t({ ru: 'Интервал проверки (сек)', en: 'Check interval (sec)' })}</label>
          <input class="wm-input" id="poll_interval" type="number" name="poll_interval" min="30" max="3600" />
          <span class="wm-field-hint">${WashModule.t({ ru: 'Как часто проверять публикации CRM.', en: 'How often to check CRM publications.' })}</span>
        </div>
        <div class="wm-field wm-field--full">
          <label class="wm-field-label" for="publish_categories">${WashModule.t({ ru: 'Категории', en: 'Categories' })}</label>
          <input class="wm-input" id="publish_categories" type="text" name="publish_categories" placeholder="news,promotion,general" />
          <span class="wm-field-hint">${WashModule.t({ ru: 'Через запятую: news, promotion, general.', en: 'Comma-separated: news, promotion, general.' })}</span>
        </div>`,
      collectSettings(form) {
        const token = String(form.vk_access_token.value || '').trim();
        const settings = {
          vk_group_id: String(form.vk_group_id.value || '').trim(),
          poll_interval: Number(form.poll_interval.value),
          publish_categories: String(form.publish_categories.value || '').trim(),
        };
        if (token) settings.vk_access_token = token;
        return settings;
      },
      applySettings(settings, form) {
        form.vk_group_id.value = settings.vk_group_id ?? '';
        form.poll_interval.value = settings.poll_interval ?? 60;
        form.publish_categories.value = settings.publish_categories ?? 'news,promotion,general';
        if (settings.vk_access_token) {
          form.vk_access_token.value = '';
          form.vk_access_token.placeholder = WashModule.t({ ru: '•••••••• (сохранён)', en: '•••••••• (saved)' });
        }
      },
      metrics(snap, status) {
        if (!snap || !snap.recordedAt) return [];
        return [
          { label: WashModule.t({ ru: 'Опубликовано', en: 'Published' }), value: snap.publishedTotal ?? 0, accent: true },
          { label: WashModule.t({ ru: 'В очереди', en: 'Pending' }), value: snap.pendingCount ?? 0 },
          { label: WashModule.t({ ru: 'За цикл', en: 'This cycle' }), value: snap.publishedThisCycle ?? 0 },
          {
            label: WashModule.t({ ru: 'VK настроен', en: 'VK configured' }),
            value: snap.configured ? WashModule.t({ ru: 'Да', en: 'Yes' }) : WashModule.t({ ru: 'Нет', en: 'No' }),
          },
        ];
      },
      renderOverview(snap, status) {
        if (!snap || !snap.recordedAt) {
          const running = status && (status.activeRunStatus === 'running' || (status.state && status.state.status === 'running'));
          const hint = running
            ? WashModule.t({ ru: 'Ожидание первой проверки публикаций…', en: 'Waiting for the first publications check…' })
            : WashModule.t({ ru: 'Нет статуса — запустите модуль.', en: 'No status yet — start the module.' });
          return `<div class="wm-empty">${WashModule.escapeHtml(hint)}</div>`;
        }
        const last = snap.lastPublished;
        const lastHtml = last
          ? `<dl class="wm-list">
              <li><span class="wm-kv"><dt>${WashModule.t({ ru: 'CRM ID', en: 'CRM ID' })}</dt><dd>${WashModule.escapeHtml(String(last.crmId || '—'))}</dd></span></li>
              <li><span class="wm-kv"><dt>${WashModule.t({ ru: 'VK post', en: 'VK post' })}</dt><dd>${WashModule.escapeHtml(String(last.vkPostId || '—'))}</dd></span></li>
              <li><span class="wm-kv"><dt>${WashModule.t({ ru: 'Заголовок', en: 'Title' })}</dt><dd>${WashModule.escapeHtml(String(last.title || '—'))}</dd></span></li>
            </dl>`
          : `<p class="wm-field-hint">${WashModule.t({ ru: 'Ещё ничего не опубликовано.', en: 'Nothing published yet.' })}</p>`;
        const errors = Array.isArray(snap.recentErrors) ? snap.recentErrors : [];
        const errHtml = errors.length
          ? `<ul class="wm-list">${errors.map((e) =>
              `<li><strong>${WashModule.escapeHtml(String(e.title || e.id || '—'))}</strong><br><span class="wm-field-hint">${WashModule.escapeHtml(String(e.error || ''))}</span></li>`
            ).join('')}</ul>`
          : `<p class="wm-field-hint">${WashModule.t({ ru: 'Ошибок нет.', en: 'No errors.' })}</p>`;
        return `
          <h2 class="wm-section-title">${WashModule.t({ ru: 'Последняя публикация', en: 'Last publication' })}</h2>
          ${lastHtml}
          <h2 class="wm-section-title" style="margin-top:1rem">${WashModule.t({ ru: 'Последние ошибки', en: 'Recent errors' })}</h2>
          ${errHtml}
          <h2 class="wm-section-title" style="margin-top:1rem">${WashModule.t({ ru: 'Статус', en: 'Status' })}</h2>
          <pre class="wm-code">${WashModule.escapeHtml(JSON.stringify(snap, null, 2))}</pre>`;
      },
    });
  </script>
</body>
</html>
